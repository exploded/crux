<title>crux Desktop Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Left rail, top bar with the target's pipeline strip, one scrolling view.
   Dark-first: an observatory tool used at night. The image well stays dark in both themes. */
:root{
  --bg:#0a0d14; --panel:#111622; --panel2:#171d2c; --line:#232b3e; --fg:#dfe5f0; --muted:#8c96ac; --faint:#5b6479;
  --accent:#8fb3ff; --accent-ink:#0a0d14; --well:#05070b;
  --good:#4fd18b; --warn:#f2c14e; --rej:#ff5c6c; --info:#8fb3ff;
  --fH:#ff5a6e; --fO:#2fd0c4; --fS:#ff9a3c; --fL:#e8ecf4; --fR:#ff6b6b; --fG:#6bdc8a; --fB:#6ba8ff;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --display:"Sora","Segoe UI",system-ui,sans-serif; --body:"Instrument Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f4f6fa; --line:#d8dde7; --fg:#131926; --muted:#566074; --faint:#8a93a6;
  --accent:#3560d8; --accent-ink:#ffffff; --well:#06080d;
  --good:#1b9a58; --warn:#b07d00; --rej:#d6334a; --info:#3560d8;
  --fH:#e0334a; --fO:#0f9c92; --fS:#d9731a; --fL:#4a5568; --fR:#e04848; --fG:#2f9e55; --fB:#3d7ae0;
  --shadow:0 8px 24px rgba(20,30,50,.12); color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f4f6fa; --line:#d8dde7; --fg:#131926; --muted:#566074; --faint:#8a93a6;
  --accent:#3560d8; --accent-ink:#ffffff; --well:#06080d;
  --good:#1b9a58; --warn:#b07d00; --rej:#d6334a; --info:#3560d8;
  --fH:#e0334a; --fO:#0f9c92; --fS:#d9731a; --fL:#4a5568; --fR:#e04848; --fG:#2f9e55; --fB:#3d7ae0;
  --shadow:0 8px 24px rgba(20,30,50,.12); color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);margin:0;overflow:hidden}
html.night{filter:url(#redshift)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:600}
h2{font-size:16px;font-weight:600}
h3{font-size:13px;font-weight:600}
.eyebrow{font:500 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.app{display:grid;grid-template-columns:76px minmax(0,1fr);height:100%}
/* rail */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding-block:14px;padding-left:env(safe-area-inset-left,0px)}
.logo{font:700 18px var(--display);letter-spacing:-.03em;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.logo svg{width:22px;height:22px}
.rail a{width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:11px;position:relative}
.rail a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
.rail a:hover{background:var(--panel2);color:var(--fg)}
.rail a.on{background:var(--panel2);color:var(--fg)}
.rail a.on::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.rail .badge{position:absolute;top:4px;right:10px;background:var(--rej);color:#fff;font:600 10px var(--body);border-radius:9px;padding:0 5px;min-width:16px;text-align:center}
.rail .spacer{flex:1}
.rtools{display:grid;gap:6px}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:6px;color:var(--muted);display:inline-flex}
.iconbtn:hover{color:var(--fg);background:var(--panel2)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
/* main */
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:20px;padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.crumb b{color:var(--fg);font-weight:600}
.pipe{display:flex;align-items:center;gap:0;flex:1;min-width:0;overflow-x:auto}
.stage{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;border:1px solid transparent;background:none;white-space:nowrap;color:var(--muted);font-size:13px}
.stage:hover{background:var(--panel2);color:var(--fg)}
.stage.on{border-color:var(--line);background:var(--panel2);color:var(--fg)}
.stage .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.stage .st{font-size:11px;color:var(--faint)}
.pipe .arrow{color:var(--faint);padding:0 2px}
.dot.warn{background:var(--warn)} .dot.rej{background:var(--rej)} .dot.good{background:var(--good)} .dot.idle{background:transparent;border:1.5px solid var(--faint)}
.jobs{position:relative}
.jobpill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--muted)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.drawer{position:absolute;right:0;top:38px;width:340px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;z-index:30}
.job{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:12.5px}
.job:last-child{border-bottom:0}
.bar{height:4px;border-radius:2px;background:var(--line);grid-column:1/-1;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.view{flex:1;overflow:auto;padding-block:20px 40px;padding-left:max(16px,20px);padding-right:max(16px,env(safe-area-inset-right,0px))}
.view[hidden]{display:none!important}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.vhead p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 12px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--rej)}
.btn.ghost{background:none}
.btn kbd,.kbd{font:500 10.5px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted);background:var(--panel)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.Good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.pill.Warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.pill.Reject{color:var(--rej);background:color-mix(in srgb,var(--rej) 14%,transparent)}
.pill.pin{outline:1.5px dashed currentColor;outline-offset:1px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12.5px;background:var(--panel);white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.chip:hover{border-color:var(--faint)}
.fchip{font:600 11px var(--mono);border-radius:4px;padding:0 5px;color:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);z-index:50;font-size:13.5px;max-width:calc(100vw - 32px)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline}
/* HOME */
.home{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.lastnight{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 10%,var(--panel)),var(--panel) 60%)}
.ln-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.big{font:600 40px/1 var(--display);letter-spacing:-.03em}
.tally{display:flex;gap:18px;flex-wrap:wrap}
.tally div{display:flex;flex-direction:column}
.tally b{font:600 22px var(--display)}
.tally span{font-size:12px;color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.target{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.target:hover{border-color:var(--faint)}
.target .img{aspect-ratio:3/2;background:var(--well) center/cover no-repeat;position:relative;max-width:100%}
.target .img .none{position:absolute;inset:0;display:grid;place-items:center;color:#7d879c;font-size:12px}
.target .meta{padding:10px 12px 12px;display:grid;gap:6px}
.ibars{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.ibars i{display:block;height:100%}
.status{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,15px);grid-auto-columns:15px;gap:4px;overflow-x:auto;padding-bottom:4px}
.cal i{width:15px;height:15px;border-radius:4px;background:var(--panel2);display:block}
.cal i.f{background:color-mix(in srgb,var(--fO) 35%,var(--panel2))}
.cal i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--panel2))}
.cal i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--panel2))}
.cal i.l3{background:var(--accent)}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lib{display:grid;gap:8px}
.libitem{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--panel2);font-size:13px;flex-wrap:wrap}
/* INBOX */
.inbox{display:grid;gap:10px;max-width:980px}
.item{display:grid;grid-template-columns:4px minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item .sev{background:var(--info)} .item .sev.warn{background:var(--warn)} .item .sev.rej{background:var(--rej)}
.item .body{padding:14px 16px;display:grid;gap:8px}
.item p{margin:0;color:var(--muted);max-width:80ch}
.item .ev{display:flex;gap:6px;flex-wrap:wrap}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs .t{border-radius:6px;cursor:pointer;border:1px solid var(--line)}
/* FRAMES */
.frames{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px;align-items:start}
.fleft{display:grid;gap:14px;min-width:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 18px}
.sl{display:grid;gap:4px}
.sl label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.sl label b{color:var(--fg);font-family:var(--mono);font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent)}
.cost{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px;padding-top:8px;border-top:1px solid var(--line)}
.cost b{font-family:var(--mono)}
.timeline{position:relative;min-width:0}
.timeline svg{display:block;width:100%;touch-action:none;user-select:none}
.brushbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;margin-top:8px}
.sheet{display:grid;gap:14px}
.grp h3{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-family:var(--body);font-weight:600;font-size:12.5px;color:var(--muted)}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{position:relative;border-radius:6px;cursor:pointer;outline:1px solid var(--line);flex:none;background-color:var(--well)}
.tile:hover{outline-color:var(--faint)}
.tile.sel{outline:2px solid var(--accent);outline-offset:1px}
.tile .g{position:absolute;left:4px;top:4px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.tile .g.Warn{background:var(--warn)} .tile .g.Reject{background:var(--rej)} .tile .g.Good{display:none}
.tile.Reject::after{content:"";position:absolute;inset:0;border-radius:6px;background:rgba(255,60,80,.18);box-shadow:inset 0 0 0 1.5px rgba(255,92,108,.8)}
.tile .pin{position:absolute;right:4px;top:3px;font-size:10px;color:#fff;text-shadow:0 0 3px #000}
.tile .tm{position:absolute;left:4px;bottom:2px;font:500 10px var(--mono);color:#cfd6e4;text-shadow:0 0 3px #000}
.insp{position:sticky;top:0;display:grid;gap:12px}
.well{position:relative;background:var(--well);border-radius:10px;overflow:hidden;aspect-ratio:6248/4176;max-width:100%}
.well img,.well .spr{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.well .tag{position:absolute;left:8px;top:8px;font:600 11px var(--mono);background:rgba(0,0,0,.6);color:#fff;padding:2px 6px;border-radius:4px}
.well .tag.ref{background:var(--accent);color:var(--accent-ink)}
.well .note{position:absolute;right:8px;bottom:8px;font-size:11px;color:#9aa4b8;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:4px}
.tgrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
.tgrid div{border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;font:600 12px var(--mono);color:#fff;text-shadow:0 0 4px #000}
.vtools{display:flex;gap:6px;flex-wrap:wrap}
.vtools .btn{padding:5px 9px;font-size:12px}
.vtools .btn.on{border-color:var(--accent);color:var(--accent)}
.verdict{display:grid;gap:8px}
.reason{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:13px}
.reason .c{font:600 11px var(--body);letter-spacing:.04em;text-transform:uppercase;padding-top:2px;min-width:86px}
.reason .c.Warn{color:var(--warn)} .reason .c.Reject{color:var(--rej)}
.mtable{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mtable div{background:var(--panel);padding:6px 8px;display:grid}
.mtable span{font-size:11px;color:var(--muted)}
.mtable b{font:500 13px var(--mono)}
.why svg{width:100%;display:block}
.acts{display:flex;gap:8px;flex-wrap:wrap}
/* ORGANISE */
.orgtabs{margin-bottom:14px}
.org{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.q{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.q input{flex:1;border:0;background:none;outline:none;min-width:0;font-family:var(--mono);font-size:13px}
.dims{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dim{cursor:grab}
.dim.dragging{opacity:.4}
.tree{font-size:13px;display:grid;gap:1px}
.node{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center;padding:5px 8px;border-radius:6px;cursor:pointer}
.node:hover{background:var(--panel2)}
.node.sel{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.node.drop{outline:2px dashed var(--accent)}
.node .tw{width:12px;color:var(--faint);font-size:10px}
.node .ct{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.node .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved{display:grid;gap:4px}
.saved button{text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.saved button:hover{background:var(--panel2)}
.ftable{width:100%;border-collapse:collapse;font-size:12.5px}
.ftable th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.ftable td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ftable tr[draggable]{cursor:grab}
.ftable tr:hover td{background:var(--panel2)}
.scroll{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px}
.rules{display:grid;gap:14px}
.rule{display:grid;gap:8px}
.tmpl{display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--panel2)}
.tok{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:3px 4px 3px 8px;font:500 12.5px var(--mono);background:color-mix(in srgb,var(--accent) 18%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);cursor:grab}
.tok.lit{background:var(--panel);border-color:var(--line)}
.tok button{border:0;background:none;color:var(--muted);padding:0 3px;font-size:13px;line-height:1}
.sep{color:var(--faint);font:500 13px var(--mono)}
.palette{display:flex;gap:6px;flex-wrap:wrap}
.palette button{font:500 12px var(--mono)}
.example{font:12.5px var(--mono);color:var(--muted);word-break:break-all}
.example b{color:var(--fg);font-weight:500}
.diff{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.dtree{font:12.5px var(--mono);display:grid;gap:1px;max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px}
.dl{display:flex;justify-content:space-between;gap:8px;padding:2px 6px;border-radius:4px;white-space:nowrap}
.dl .n{overflow:hidden;text-overflow:ellipsis}
.dl.gone{color:var(--faint);text-decoration:line-through}
.dl.new{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good)}
.dl.chg{background:color-mix(in srgb,var(--warn) 10%,transparent)}
.dl .c{color:var(--muted)}
.summary{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.summary div{display:grid}
.summary b{font:600 20px var(--display)}
.summary span{font-size:12px;color:var(--muted)}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--good);width:0;transition:width .2s}
.treemap{position:relative;height:340px;border-radius:10px;overflow:hidden;background:var(--panel2)}
.tmc{position:absolute;border:2px solid var(--panel);border-radius:6px;padding:6px 8px;font-size:12px;overflow:hidden;color:#0b0e14}
.tmc b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmc span{font-family:var(--mono);font-size:11px}
.tmc.reg{background:repeating-linear-gradient(135deg,#f2c14e 0 8px,#e3ae35 8px 16px)}
.findings{display:grid;gap:10px}
.finding{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.finding .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px}
.finding p{margin:2px 0 8px;color:var(--muted);font-size:13px}
.hist{display:grid;gap:10px}
.hent{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.hent .t{font:12px var(--mono);color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(5,8,14,.6);display:grid;place-items:center;z-index:60;padding:16px}
.modal .card{max-width:520px;width:100%;box-shadow:var(--shadow)}
/* CALIBRATION */
.calgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.graph svg{width:100%;display:block}
.sets{width:100%;border-collapse:collapse;font-size:12.5px}
.sets td,.sets th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.sets th{color:var(--muted);font-weight:500;font-size:11.5px}
.sets tr.bad td{color:var(--rej)}
.sets tr{cursor:pointer}
.sets tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.heat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.heat figure{margin:0;display:grid;gap:6px}
.heat canvas{width:100%;aspect-ratio:3/2;border-radius:8px;display:block;max-width:100%}
.heat figcaption{font-size:12px;color:var(--muted)}
.scale{height:8px;border-radius:4px;background:linear-gradient(90deg,#2c6bff,#9fb8ff,#f4f4f4,#ffb38a,#ff3b30)}
.matrix{border-collapse:collapse;font:12px var(--mono)}
.matrix td,.matrix th{padding:5px 8px;text-align:center;border:1px solid var(--line)}
.matrix th{font:500 11px var(--body);color:var(--muted)}
/* IMAGE */
.imgv{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.stages{display:grid;gap:6px}
.stg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:left;width:100%}
.stg.on{border-color:var(--accent)}
.stg small{grid-column:2;color:var(--muted);font-size:12px}
.split{position:relative;background:var(--well);border-radius:10px;overflow:hidden;max-width:100%}
.split canvas{display:block;width:100%;height:auto}
.split .before{position:absolute;inset:0;overflow:hidden}
.split .before canvas{width:auto;height:auto;max-width:none}
.split .handle{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.6);cursor:ew-resize}
.split .handle::after{content:"⟷";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#000;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:13px}
.split .lab{position:absolute;top:8px;font:600 11px var(--mono);color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:4px}
.presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.presets button{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--well);position:relative}
.presets button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.presets canvas{display:block;width:100%;height:auto}
.presets span{position:absolute;left:6px;bottom:4px;font-size:11px;color:#fff;text-shadow:0 0 4px #000}
.depth{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.src{font-size:11px;color:var(--faint)}
.src.over{color:var(--accent)}
.help{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
/* responsive */
@media (max-width:1180px){.frames{grid-template-columns:minmax(0,1fr)}.insp{position:static}.home{grid-template-columns:minmax(0,1fr)}.calgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.org{grid-template-columns:minmax(0,1fr)}.imgv{grid-template-columns:minmax(0,1fr)}.diff{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .rail{grid-row:2;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));overflow-x:auto}
  .rail .logo,.rail .spacer,.rail .rtools{display:none}
  .rail a{width:auto;min-width:52px;font-size:10px}
  .rail a.on::before{left:12px;right:12px;top:-4px;bottom:auto;width:auto;height:3px}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .view{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .big{font-size:32px}
  .presets{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const D = /*DATA*/null;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtH = s => { const m = Math.round(s / 60); return `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')} m`; };
const GB = b => (b / 1e9).toFixed(1) + ' GB';
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dShort = n => { const [y, m, d] = n.split('-'); return `${+d} ${MON[m - 1]}`; };
const hhmm = t => t.slice(11, 16);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const FCOL = f => `var(--f${f})`;
const store = { get(k, d) { try { const v = localStorage.getItem('crux-mock-' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('crux-mock-' + k, JSON.stringify(v)); } catch {} } };

/* ---------- data prep ---------- */
const L = D.lights;
const byId = new Map(L.map((l, i) => { l.idx = i; return [l.id, l]; }));
const RANK = { Good: 0, Warn: 1, Reject: 2 };
const NIGHTS = [...new Set(L.map(l => l.night))].sort();
const DEF = { t: 0.5, trail: 1.0, focus: 1.5, sky: 4.0 };
const S = {
  view: 'home', th: { ...DEF }, over: new Map(store.get('over', [])), undo: [], sel: null,
  night: '2026-11-11', metric: 'T', show: 'all', sort: 'time', brush: null, overlay: { marks: false, grid: false }, blink: false,
  moved: new Map(), history: [], corrections: new Map(), orgTab: 'browse', dims: ['panel', 'night'], query: '', node: null,
  saved: [ { n: 'Clean H subs, FWHM < 4.5 px', q: 'grade:good fwhm<4.5' }, { n: 'Everything crux rejects', q: 'grade:reject' }, { n: 'Panel 26, all nights', q: 'panel:26' }, { n: 'Thin cloud (T < 0.8)', q: 't<0.8' } ],
};
const ADJ = {
  Transparency: { key: 'T', th: 't', rej: (v, t) => v < t, say: l => `transparency ${l.T.toFixed(2)}: stars at ${Math.round(l.T * 100)}% of their brightness in the field's best frame` },
  Trail: { key: 'tx', th: 'trail', rej: (v, t, o) => v > t + 1e-9 || (Math.abs(v - t) < 1e-9 && o), say: l => `trail at ${l.tx.toFixed(1)}× the pixel noise` },
  Focus: { key: 'fr', th: 'focus', rej: (v, t) => v >= t, say: l => `FWHM ${l.fwhm} px, ${l.fr.toFixed(2)}× the night median` },
  Sky: { key: 'skyr', th: 'sky', rej: (v, t) => v >= t, say: l => `sky ${l.sky.toFixed(3)} e-/px/s, ${l.skyr.toFixed(1)}× the panel's best` },
};
function flagsOf(l) {
  const out = l.flags.filter(f => !ADJ[f.c]);
  for (const [c, a] of Object.entries(ADJ)) {
    const o = l.flags.find(f => f.c === c); const v = l[a.key];
    if (v != null && a.rej(v, S.th[a.th], o && o.g === 'Reject')) out.push({ c, g: 'Reject', r: o ? o.r : a.say(l) });
    else if (o) out.push({ c, g: 'Warn', r: o.r });
  }
  return out.sort((a, b) => RANK[b.g] - RANK[a.g]);
}
function autoGrade(l) { let g = 'Good'; for (const f of flagsOf(l)) if (RANK[f.g] > RANK[g]) g = f.g; return g; }
const grade = l => S.over.get(l.id) || autoGrade(l);
const isRejected = l => grade(l) === 'Reject';
const panelCohort = new Map();
for (const l of L) { if (!panelCohort.has(l.panel)) panelCohort.set(l.panel, []); panelCohort.get(l.panel).push(l); }
function refOf(l) { const c = panelCohort.get(l.panel).filter(x => x.T != null && x.id !== l.id); return c.length ? c.reduce((a, b) => (b.T > a.T ? b : a)) : null; }
const hrs = s => s / 3600;
const TOTAL = L.reduce((a, l) => a + l.exp, 0);
const isFeatured = id => D.featured.includes(id);
const targetOf = obj => (obj || '').replace(/\s*Panel\s*\d+$/i, '') || 'Unknown';

function sprite(l, w) {
  const H = w * 144 / 216, r = Math.floor(l.idx / 20), c = l.idx % 20, rows = Math.ceil(L.length / 20);
  return `background-image:url(img/sprite.jpg);background-size:${20 * w}px ${rows * H}px;background-position:-${c * w}px -${r * H}px;width:${w}px;height:${H}px`;
}

/* ---------- routing ---------- */
const VIEWS = ['home', 'inbox', 'frames', 'organise', 'calibration', 'image'];
function go(v) { location.hash = v; }
function route() {
  const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home';
  S.view = v;
  for (const x of VIEWS) $('#v-' + x).hidden = x !== v;
  $$('.rail a').forEach(a => a.classList.toggle('on', a.dataset.v === v));
  render();
}
window.addEventListener('hashchange', route);

function render() {
  renderPipe(); renderBadge();
  ({ home: renderHome, inbox: renderInbox, frames: renderFrames, organise: renderOrganise, calibration: renderCalibration, image: renderImage })[S.view]();
}
function toast(msg, undo) {
  const host = $('#toastHost'); host.innerHTML = '';
  const t = h(`<div class="toast" role="status"><span>${msg}</span>${undo ? '<button>Undo</button>' : ''}</div>`);
  if (undo) t.querySelector('button').onclick = () => { undo(); host.innerHTML = ''; };
  host.append(t); clearTimeout(toast.t); toast.t = setTimeout(() => { host.innerHTML = ''; }, 5000);
}
function saveOver() { store.set('over', [...S.over]); }
function setOverride(ids, g, label) {
  const prev = ids.map(id => [id, S.over.get(id)]);
  for (const id of ids) { const l = byId.get(id); if (g == null || autoGrade(l) === g) S.over.delete(id); else S.over.set(id, g); }
  S.undo.push(prev); saveOver(); render();
  toast(label || `${ids.length} frame${ids.length > 1 ? 's' : ''} marked ${g === 'Reject' ? 'reject' : 'keep'}`, undoLast);
}
function undoLast() { const p = S.undo.pop(); if (!p) return; for (const [id, g] of p) { if (g) S.over.set(id, g); else S.over.delete(id); } saveOver(); render(); }

/* ---------- pipeline strip + badge ---------- */
function counts(list = L) { const c = { Good: 0, Warn: 0, Reject: 0 }; for (const l of list) c[grade(l)]++; return c; }
function renderPipe() {
  const c = counts(), flagged = c.Warn + c.Reject;
  const calBad = D.sets.filter(s => s.grade === 'Reject').length;
  const st = [
    ['frames', 'Frames', c.Reject ? 'warn' : 'good', `${flagged} to review`],
    ['calibration', 'Calibration', calBad ? 'rej' : 'good', calBad ? `${calBad} problems` : 'ok'],
    ['organise', 'Organise', S.history.length ? 'good' : 'warn', S.history.length ? 'filed' : 'plan ready'],
    ['image', 'Stack', 'idle', 'ready to run'],
    ['image', 'Image', 'idle', 'not started'],
  ];
  $('#pipe').innerHTML = st.map(([v, n, d, s], i) => `${i ? '<span class="arrow">›</span>' : ''}<button class="stage${S.view === v && n !== 'Stack' ? ' on' : ''}" data-go="${v}"><span class="dot ${d}"></span>${n}<span class="st">${s}</span></button>`).join('');
  $$('#pipe .stage').forEach(b => b.onclick = () => go(b.dataset.go));
}
function inboxItems() {
  const items = [];
  const loose = D.others.filter(o => o.kinds.Flat && !o.lightSecs.H && !o.objects.length);
  const same = D.choices.filter(c => loose.some(o => o.folder === c.night));
  if (same.length) items.push({ id: 'samenight', sev: 'warn', title: `Same-night flats exist for ${same.length} LMC nights, but October flats were matched`,
    body: `Flats shot at dawn after ${same.map(c => dShort(c.night)).join(', ')} sit in their own folders (${same.map(c => c.night).join(', ')}), outside the LMC folder. crux matched those ${same.reduce((a, c) => a + c.n, 0)} lights to H flats from 19 Oct, ${-same[same.length - 1].days} nights earlier. Add the folders to the library and crux will check and use the same-night sets.`,
    ev: same.map(c => `${dShort(c.night)} · ${c.n} lights · ${-c.days} nights apart`), acts: [['Add 3 folders to the library', 'primary'], ['Keep October flats', '']] });
  const src = D.sets.filter(s => s.flags.some(f => f.c === 'Source'));
  if (src.length) items.push({ id: 'masters', sev: 'rej', title: 'The LMC master flats were built from the bad flats',
    body: `All ${src.length} master flats (built 9 Nov) were integrated from the cloudy 4 Nov set now in FLAT.bad. Against 237 lights the H master leaves ${src[0].vsl ? src[0].vsl.spread.toFixed(1) : '12.7'}% error, left to right. crux will calibrate with the October raw flats instead.`,
    ev: src.map(s => s.label.replace(/ \(.*?\)/, '')), acts: [['Use October raw flats', 'primary'], ['Show heat map', '', () => go('calibration')]] });
  const keptRej = L.filter(l => !l.bad && autoGrade(l) === 'Reject'), badGood = L.filter(l => l.bad && autoGrade(l) === 'Good');
  if (keptRej.length || badGood.length) items.push({ id: 'disagree', sev: 'warn', title: `crux disagrees with your folders on ${keptRej.length + badGood.length} frames`,
    body: `${keptRej.length} frames you kept look rejectable (bright satellites, soft focus), and ${badGood.length} frame in BAD\\ looks fine to crux. Your choice wins; crux only asks once.`,
    thumbs: [...keptRej, ...badGood], acts: [['Review them', 'primary', () => { S.show = 'disagree'; go('frames'); }]] });
  const border = L.filter(l => !S.over.has(l.id) && ((l.T != null && l.T >= S.th.t && l.T < S.th.t + 0.06) || (l.tx != null && l.tx < S.th.trail && l.tx >= S.th.trail - 0.2) || (l.fr != null && l.fr < S.th.focus && l.fr >= S.th.focus - 0.12) || (l.skyr != null && l.skyr < S.th.sky && l.skyr >= S.th.sky - 0.5)));
  if (border.length) items.push({ id: 'border', sev: 'info', title: `${border.length} frames sit just inside a reject limit`,
    body: 'Borderline transparency, trail brightness, focus or sky. Each is kept for now; a quick look settles them.', thumbs: border, acts: [['Review borderline', 'primary', () => { S.show = 'border'; go('frames'); }]] });
  items.push({ id: 'nodarks', sev: 'info', title: 'No raw darks or bias in this folder: using WBPP masters',
    body: 'The master dark and bias carry no GAIN, OFFSET or CCD-TEMP, so they were matched on exposure and frame size only. Raw darks and bias from 29 Sep are in .local and are all clean.', acts: [['Accept', 'primary']] });
  return items.filter(i => !(S.doneInbox || new Set()).has(i.id));
}
function renderBadge() { const n = inboxItems().length; const b = $('#inboxBadge'); b.textContent = n; b.hidden = !n; }

/* ---------- HOME ---------- */
function renderHome() {
  const last = NIGHTS[NIGHTS.length - 1], ln = L.filter(l => l.night === last), c = counts(ln);
  const cloud = ln.filter(l => flagsOf(l).some(f => ['Transparency', 'Sky', 'Stars', 'Patchy'].includes(f.c))).map(l => l.time).sort()[0];
  const loose = D.others.find(o => o.folder === last);
  const moon = ln.find(l => l.millum != null);
  const lmcGood = L.filter(l => grade(l) !== 'Reject').reduce((a, l) => a + l.exp, 0);
  const tgts = [
    { k: 'lmc', n: 'LMC Mosaic', sub: `36 panels · ${NIGHTS.length} nights · Nov 2026`, secs: { H: TOTAL }, st: ['warn', `${counts().Warn + counts().Reject} frames to review`], go: 'frames' },
    ...D.others.filter(o => o.objects.length).map(o => {
      const name = o.folder.replace(/^\d{4}-\d{2}-\d{2}[ _]/, '');
      const k = { 'M42': 'm42', 'NGC 2070 LRGB': 'ngc2070', 'NGC 7293': 'ngc7293' }[name];
      const panels = new Set(o.objects).size;
      return { k, n: name, sub: `${panels > 1 ? panels + ' panels · ' : ''}${o.nights.length} nights · ${dShort(o.nights[0])} ${o.nights[0].slice(0, 4)}`, secs: o.lightSecs,
        st: k ? ['good', 'Stacked · not scanned in this mockup'] : ['idle', 'Not stacked yet'] };
    }),
  ];
  const cal = calendar();
  $('#v-home').innerHTML = `
  <div class="vhead"><div><h1>Good morning, James</h1><p>crux watched C:\\PixInsight overnight. Everything below comes from your real files; only the Autopilot estimate is an example.</p></div>
  <div class="row"><button class="btn" id="addFolder">＋ Add folder</button></div></div>
  <div class="home">
    <div style="display:grid;gap:16px;min-width:0">
      <article class="card lastnight">
