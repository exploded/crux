[package]
name = "crux-core"
description = "Core library for crux: file readers, image types, statistics and frame checks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
rayon.workspace = true
walkdir.workspace = true
roxmltree.workspace = true
flate2.workspace = true
lz4_flex.workspace = true
toml.workspace = true
sha2.workspace = true
dirs.workspace = true
semver.workspace = true
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rusqlite = { workspace = true, optional = true }
tract-onnx = { version = "0.23", optional = true }
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
pollster = { version = "1", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }
ureq = { workspace = true, optional = true }

[features]
default = ["sqlite", "ml", "gpu", "update"]
# The library index in SQLite (compiles SQLite's C source). Without it the
# index is JSON; `build.bat platforms` checks that way (no cross C compiler).
sqlite = ["dep:rusqlite"]
# crux's trained networks (denoiser, star corrector), run on the CPU with
# tract; the models are compiled in (models/).
ml = ["dep:tract-onnx"]
# Compute on the graphics card through wgpu (DX12, Vulkan or Metal): the
# networks (with `ml`), warps. Everything falls back to the CPU when no
# suitable adapter is found or it fails.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# Ask GitHub whether a newer crux has been released (`update`). rustls's
# `ring` compiles C, so `build.bat platforms` checks without it.
update = ["dep:ureq"]
