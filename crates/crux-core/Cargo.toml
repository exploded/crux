[package]
name = "crux-core"
description = "Core library for crux: file readers, image types, statistics and frame checks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
rayon.workspace = true
walkdir.workspace = true
roxmltree.workspace = true
flate2.workspace = true
lz4_flex.workspace = true
toml.workspace = true
sha2.workspace = true
dirs.workspace = true
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rusqlite = { workspace = true, optional = true }
tract-onnx = { version = "0.23", optional = true }

[features]
default = ["sqlite", "ml"]
# The library index in SQLite (compiles SQLite's C source). Without it the
# index is JSON; `build.bat platforms` checks that way (no cross C compiler).
sqlite = ["dep:rusqlite"]
# crux's trained networks (denoiser, star corrector), run on the CPU with
# tract; the models are compiled in (models/).
ml = ["dep:tract-onnx"]
