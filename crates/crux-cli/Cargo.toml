[package]
name = "crux-cli"
description = "crux command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "crux"
path = "src/main.rs"

[dependencies]
crux-core.workspace = true
anyhow.workspace = true
clap.workspace = true
walkdir.workspace = true
serde_json.workspace = true
chrono.workspace = true
png = "0.17"

[features]
default = ["sqlite", "ml"]
sqlite = ["crux-core/sqlite"]
ml = ["crux-core/ml"]
