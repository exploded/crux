[package]
name = "crux-gui"
description = "crux desktop app (eframe/egui on wgpu)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "crux-gui"
path = "src/main.rs"

[dependencies]
crux-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rayon.workspace = true
walkdir.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui-wgpu = "0.37"
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
rfd = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[build-dependencies]
embed-resource = "3"

[features]
default = ["sqlite", "ml"]
sqlite = ["crux-core/sqlite"]
ml = ["crux-core/ml"]
